<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Scanner Pro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid #e2e8f0 !important; }
        
        /* Tombol Absensi */
        .absensi-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-absensi { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-in { background: var(--success); opacity: 0.5; }
        .btn-out { background: var(--primary); opacity: 0.5; }
        .btn-active { opacity: 1 !important; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* Timer & Status */
        #cooldown-box { display: none; text-align: center; color: var(--danger); font-weight: bold; margin-top: 10px; }
        .status-badge { display: block; text-align: center; padding: 8px; border-radius: 8px; background: #e2e8f0; margin-bottom: 10px; font-size: 13px; }

        /* Log Table */
        .log-container { max-height: 200px; overflow-y: auto; margin-top: 10px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #f1f5f9; position: sticky; top: 0; padding: 8px; }
        td { padding: 8px; border-bottom: 1px solid #f1f5f9; text-align: center; }

        .btn-locate { display: block; width: 100%; padding: 10px; background: #333; color: white; text-align: center; text-decoration: none; border-radius: 8px; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="margin:0; color: var(--primary); text-align:center;">Master Scanner</h2>
        <p style="text-align:center; font-size:12px; color:#64748b;">System Storage & Attendance</p>
        
        <div id="status-msg" class="status-badge">PILIH MODE LALU SCAN</div>
        
        <div id="reader"></div>

        <div class="absensi-group">
            <button id="mode-in" class="btn-absensi btn-in" onclick="setMode('MASUK')">ABSEN MASUK</button>
            <button id="mode-out" class="btn-absensi btn-out" onclick="setMode('PULANG')">ABSEN PULANG</button>
        </div>
        
        <div id="cooldown-box">Tunggu <span id="timer">15</span> detik untuk scan lagi...</div>
    </div>

    <div class="card">
        <h3>Riwayat (Local Storage)</h3>
        <div class="log-container">
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Mode</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
        </div>
        <button onclick="clearStorage()" style="width:100%; margin-top:10px; border:none; background:none; color:var(--danger); cursor:pointer; font-size:12px;">❌ Hapus Riwayat</button>
        
        <a id="btn-locate" href="#" target="_blank" class="btn-locate" style="display:none;">📍 LOCATE IP/COORDINATE SERVER</a>
    </div>
</div>

<script>
    let currentMode = "";
    let canScan = true;
    const logBody = document.getElementById('log-body');
    const btnLocate = document.getElementById('btn-locate');

    // Load data dari storage saat start
    window.onload = () => { displayLogs(); };

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('mode-in').classList.remove('btn-active');
        document.getElementById('mode-out').classList.remove('btn-active');
        
        if(mode === 'MASUK') document.getElementById('mode-in').classList.add('btn-active');
        else document.getElementById('mode-out').classList.add('btn-active');
        
        document.getElementById('status-msg').innerText = "MODE: " + mode + " (SIAP SCAN)";
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (!canScan) return;
        if (currentMode === "") {
            alert("Pilih mode (MASUK/PULANG) terlebih dahulu!");
            return;
        }

        canScan = false;
        if (navigator.vibrate) navigator.vibrate(100);

        // Simpan ke Local Storage
        saveData(decodedText, currentMode);
        
        // Fitur Locate Server
        handleLocate(decodedText);

        // Jalankan Cooldown 15 Detik
        startCooldown(15);
    }

    function saveData(content, mode) {
        const logs = JSON.parse(localStorage.getItem('scanner_logs') || "[]");
        const entry = {
            time: new Date().toLocaleTimeString(),
            mode: mode,
            data: content.substring(0, 20) + (content.length > 20 ? "..." : "")
        };
        logs.unshift(entry); // Tambah ke paling atas
        localStorage.setItem('scanner_logs', JSON.stringify(logs));
        displayLogs();
    }

    function displayLogs() {
        const logs = JSON.parse(localStorage.getItem('scanner_logs') || "[]");
        logBody.innerHTML = logs.map(l => `
            <tr>
                <td>${l.time}</td>
                <td style="color:${l.mode === 'MASUK' ? 'green' : 'blue'}; font-weight:bold">${l.mode}</td>
                <td>${l.data}</td>
            </tr>
        `).join('');
    }

    function handleLocate(text) {
        const urlMatch = text.match(/(https?:\/\/[^\s\/]+)/);
        if (urlMatch) {
            const domain = new URL(urlMatch[0]).hostname;
            btnLocate.style.display = "block";
            btnLocate.innerText = "Mencari Lokasi Server...";
            
            fetch(`https://ipapi.co/${domain}/json/`)
                .then(r => r.json())
                .then(data => {
                    btnLocate.href = `https://www.google.com/maps?q=${data.latitude},${data.longitude}`;
                    btnLocate.innerText = `📍 LOKASI SERVER: ${data.city} (${data.latitude}, ${data.longitude})`;
                });
        } else {
            btnLocate.style.display = "none";
        }
    }

    function startCooldown(seconds) {
        const box = document.getElementById('cooldown-box');
        const timerTxt = document.getElementById('timer');
        box.style.display = "block";
        
        let timeLeft = seconds;
        timerTxt.innerText = timeLeft;

        const interval = setInterval(() => {
            timeLeft--;
            timerTxt.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(interval);
                box.style.display = "none";
                canScan = true;
            }
        }, 1000);
    }

    function clearStorage() {
        if(confirm("Hapus semua riwayat?")) {
            localStorage.removeItem('scanner_logs');
            displayLogs();
        }
    }

    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render(onScanSuccess);
</script>

</body>
</html>
