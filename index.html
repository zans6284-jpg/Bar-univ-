<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Web Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #scanner-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; }
        .controls { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        input[type="file"] { padding: 10px; background: #eee; border-radius: 5px; }
        
        /* Tabel Data */
        .result-card { margin-top: 25px; width: 100%; max-width: 600px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; word-break: break-all; }
        th { background-color: #007bff; color: white; border-radius: 4px; }
        .link-btn { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="scanner-container">
    <h2>Scanner Barcode & QR</h2>
    
    <div id="reader"></div>

    <div class="controls">
        <label><strong>Scan dari Galeri:</strong></label>
        <input type="file" id="qr-input-file" accept="image/*">
    </div>
</div>

<div class="result-card">
    <h3>Data Terdeteksi</h3>
    <table>
        <thead>
            <tr>
                <th>Properti</th>
                <th>Informasi</th>
            </tr>
        </thead>
        <tbody id="result-body">
            <tr>
                <td>Format</td>
                <td id="res-name">-</td>
            </tr>
            <tr>
                <td>Isi/Konten</td>
                <td id="res-link">-</td>
            </tr>
            <tr>
                <td>Tautan Web</td>
                <td id="res-web">-</td>
            </tr>
            <tr>
                <td>Status/Alamat</td>
                <td id="res-addr">-</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const resultName = document.getElementById('res-name');
    const resultLink = document.getElementById('res-link');
    const resultWeb = document.getElementById('res-web');
    const resultAddr = document.getElementById('res-addr');

    // Fungsi untuk memproses hasil scan
    function onScanSuccess(decodedText, decodedResult) {
        // 1. Nama/Format Barcode
        resultName.innerText = decodedResult.result.format.formatName;
        
        // 2. Konten/Link
        resultLink.innerText = decodedText;

        // 3. Link Web (Cek apakah teks adalah URL)
        if (decodedText.startsWith("http")) {
            resultWeb.innerHTML = `<a href="${decodedText}" target="_blank" class="link-btn">Buka Tautan</a>`;
        } else {
            resultWeb.innerText = "Bukan Tautan URL";
        }

        // 4. Alamat (Simulasi ekstraksi jika data mengandung kata kunci tertentu)
        // Catatan: Barcode biasanya hanya berisi teks. Alamat hanya muncul jika di-encode di dalamnya.
        resultAddr.innerText = decodedText.includes("http") ? "Tautan Eksternal" : "Data Teks Lokal";
        
        // Berhenti scan setelah sukses (opsional)
        // html5QrcodeScanner.clear(); 
    }

    // --- Konfigurasi Kamera Real-time ---
    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 10, 
            qrbox: {width: 250, height: 250},
            // Mendukung kamera depan (user) dan belakang (environment)
            rememberLastUsedCamera: true,
            supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
        }
    );
    html5QrcodeScanner.render(onScanSuccess);

    // --- Konfigurasi Scan dari Foto/File ---
    const fileInput = document.getElementById('qr-input-file');
    const html5QrCode = new Html5Qrcode("reader");

    fileInput.addEventListener('change', e => {
        if (e.target.files.length == 0) return;
        
        const imageFile = e.target.files[0];
        html5QrCode.scanFile(imageFile, true)
            .then(decodedText => {
                // Gunakan fungsi yang sama untuk menampilkan hasil
                onScanSuccess(decodedText, { result: { format: { formatName: "Image File" } } });
            })
            .catch(err => {
                alert("Gagal membaca barcode: " + err);
            });
    });
</script>

</body>
</html>
